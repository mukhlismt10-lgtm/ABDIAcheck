  --l: #96630B; --l-bg: #FFF1D6;
  --v: #2C6FA8; --v-bg: #E1EEF9;
  --a: #B8412F; --a-bg: #FBE4DF;
  --tint-rose: #FDF0EE; --tint-sky: #EDF5FF; --tint-butter: #FFF9E6; --tint-mint: #EBFDF4;
  --font-display: 'Mali', 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
  --font-body: 'Mali', 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { color-scheme: light; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--surface); z-index: 60;
}
h1, h2, h3, .disp { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--sage); outline-offset: 2px;
}
.ic { flex: none; display: inline-block; vertical-align: -0.2em; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; min-width: 0; }
.muted { color: var(--ink2); }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.wrapx { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sage-l); border: 2px solid var(--sage-bd); padding: 2px; flex: none; }
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar .emo { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 24px; line-height: 1; }
.avatar.sm2 .emo { font-size: 21px; }
.avpick2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.avpick2 button { min-height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 24px; display: flex; align-items: center; justify-content: center; padding: 2px; }
.avpick2 button[aria-pressed="true"] { border-color: var(--sage); background: var(--sage-l); }
.avpick2 button svg { width: 34px; height: 34px; }
.avatar.sm2 { width: 36px; height: 36px; border-width: 1px; background: var(--surface); }
.hello { font-size: 12px; color: var(--ink2); line-height: 1.2; }
.tname { font-family: var(--font-display); font-size: 18px; line-height: 1.2; }
.roomchip { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--sage-l); color: var(--sage-d); border: 1px solid var(--sage-bd); font-weight: 600; font-size: 13px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--sand); display: grid; place-items: center; color: var(--ink2); }
.sync { width: 10px; height: 10px; border-radius: 50%; background: #B9B4A4; flex: none; }
.sync.synced { background: var(--p); }
.sync.saving { background: #D9A441; }
.sync.error { background: var(--a); }

/* main + nav */
main { padding-block: 16px 112px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: flex; }
.nav button { flex: 1; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #7E887F; font-size: 12px; font-weight: 500; }
.nav button[aria-current="page"] { color: var(--sage-d); font-weight: 700; }
.nav button[aria-current="page"] .ic { stroke-width: 2.4; }

/* cards + type */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.card + .card, .card + .sect, .sect + .card { margin-top: 14px; }
.sect { margin-top: 14px; }
.h2 { font-size: 21px; line-height: 1.25; }
.h3 { font-size: 17px; line-height: 1.3; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.banner { background: #E7F0EB; border: 1px solid #D3E5DA; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.banner .av { width: 64px; height: 64px; flex: none; }
.banner .av svg { width: 100%; height: 100%; }
.quote { font-family: var(--font-display); font-size: 17px; line-height: 1.35; color: #264A39; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 14px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .08s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--sage); border-color: var(--sage); color: var(--on-sage); }
.btn.primary:hover { background: var(--sage-d); }
.btn.soft { background: var(--sage-l); border-color: var(--sage-bd); color: var(--sage-d); }
.btn.danger { background: var(--a-bg); border-color: #F3CBC3; color: var(--a); }
.btn.s { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.btn.block { width: 100%; }
.linkbtn { color: var(--ink2); font-size: 13px; text-decoration: underline; min-height: 36px; }
.del { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--a); flex: none; }
.del:hover { background: var(--a-bg); }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--sage); border-color: var(--sage); color: var(--on-sage); }
.sico { width: 24px; height: 24px; border-radius: 8px; display: inline-grid; place-items: center; flex: none; }
.c-rose { background: #FCE4E0; color: #B24A3A; }
.c-sky { background: #DDEBFA; color: #2C6FA8; }
.c-purple { background: #EBE3FA; color: #6A4BB0; }
.c-amber { background: #FDEBC8; color: #8F5F0C; }
.c-green { background: #DCEFE3; color: #2F7D5B; }
.c-teal { background: #D6F0EE; color: #1E7A74; }

/* forms */
input[type=text], input[type=password], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 16px;
}
textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0 0 4px; }
.field + .field { margin-top: 12px; }
.search { position: relative; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink2); }
.search input { padding-left: 38px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { border-radius: 20px; padding: 14px; text-align: left; border: 1px solid rgba(0,0,0,.05); display: flex; flex-direction: column; gap: 8px; min-height: 108px; }
.tile .tico { width: 40px; height: 40px; border-radius: 14px; background: #fff; display: grid; place-items: center; }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.tile span.d { font-size: 12.5px; color: var(--ink2); line-height: 1.35; }
.t-sky { background: var(--tint-sky); } .t-sky .tico { color: #3C7FC0; }
.t-mint { background: var(--tint-mint); } .t-mint .tico { color: var(--p); }
.t-rose { background: var(--tint-rose); } .t-rose .tico { color: #D0604E; }
.t-butter { background: var(--tint-butter); } .t-butter .tico { color: #B98414; }

/* status pills + counts */
.pill { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.p { background: var(--p-bg); color: var(--p); }
.pill.l { background: var(--l-bg); color: var(--l); }
.pill.v { background: var(--v-bg); color: var(--v); }
.pill.a { background: var(--a-bg); color: var(--a); }
.pill.n { background: var(--sand); color: var(--ink2); }
.counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.count { border-radius: 16px; padding: 8px 4px; text-align: center; }
.count b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; font-weight: 600; }
.count.p { background: var(--p-bg); color: var(--p); } .count.l { background: var(--l-bg); color: var(--l); }
.count.v { background: var(--v-bg); color: var(--v); } .count.a { background: var(--a-bg); color: var(--a); }
.count.n { background: var(--sand); color: var(--ink2); }

/* student rows */
.srow { background: var(--sand); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.srow + .srow { margin-top: 8px; }
.srow .name { font-weight: 700; font-size: 15px; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.seg button { min-height: 42px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; color: var(--ink2); }
.seg button[aria-pressed="true"].p { background: var(--p); border-color: var(--p); color: #fff; }
.seg button[aria-pressed="true"].l { background: #C28411; border-color: #C28411; color: #fff; }
.seg button[aria-pressed="true"].v { background: var(--v); border-color: var(--v); color: #fff; }
.seg button[aria-pressed="true"].a { background: var(--a); border-color: var(--a); color: #fff; }
.mini { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #D9D3C3; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.mini b.p { color: var(--p); } .mini b.l { color: var(--l); } .mini b.v { color: var(--v); } .mini b.a { color: var(--a); }
.rate { font-family: var(--font-display); font-size: 17px; color: var(--sage-d); background: var(--sage-l); border-radius: 999px; padding: 0 10px; min-height: 28px; display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; }
.tog { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 13px; background: var(--a-bg); color: var(--a); }
.tog.on { background: var(--sage); color: var(--on-sage); }
.scorebox { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; min-height: 40px; }
.scorebox input { width: 56px; min-height: 36px; border: 0; padding: 0; text-align: center; font-weight: 700; background: transparent; border-radius: 0; }
.actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.actions .grow { flex: 1; }

/* items (assignments / score items) */
.item { width: 100%; text-align: left; background: var(--sand); border: 2px solid transparent; border-radius: 18px; padding: 12px; display: block; }
.item + .item { margin-top: 8px; }
.item[aria-pressed="true"] { border-color: var(--sage); background: var(--sage-l); }
.bar { height: 8px; border-radius: 999px; background: #E0DACB; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--sage); }
.bar.amber i { background: #D9A441; }

.empty { text-align: center; color: var(--ink2); padding: 22px 8px; font-size: 14px; }
.empty .ic { color: #B9B4A4; margin-bottom: 4px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step .n { width: 28px; height: 28px; border-radius: 50%; background: var(--sage-l); color: var(--sage-d); display: grid; place-items: center; font-weight: 700; flex: none; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { background: var(--sand); font-weight: 700; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
th:first-child { background: var(--sand); }
tr:last-child td { border-bottom: 0; }

/* modal */
.overlay { position: fixed; inset: 0; z-index: 90; background: rgba(35, 45, 38, .45); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modalbox { background: var(--surface); border-radius: 24px; width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; padding: 18px; border: 1px solid var(--line); }
.modalbox .mh { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.btnrow { display: flex; gap: 8px; margin-top: 16px; }
.btnrow .btn { flex: 1; }
.avpick { display: flex; gap: 10px; }
.avpick label { cursor: pointer; }
.avpick input { position: absolute; opacity: 0; pointer-events: none; }
.avpick .av2 { display: block; width: 52px; height: 52px; border-radius: 50%; padding: 3px; border: 2px solid var(--line); background: var(--sand); }
.avpick input:checked + .av2 { border-color: var(--sage); background: var(--sage-l); }
.avpick input:focus-visible + .av2 { outline: 2px solid var(--sage); outline-offset: 2px; }
.avpick svg { width: 100%; height: 100%; display: block; }
.picker { display: flex; gap: 8px; flex-wrap: wrap; }
.picker label { cursor: pointer; }
.picker input { position: absolute; opacity: 0; pointer-events: none; }
.picker .sico { width: 44px; height: 44px; border-radius: 14px; border: 2px solid transparent; }
.picker input:checked + .sico { border-color: var(--sage-d); }
.picker input:focus-visible + .sico { outline: 2px solid var(--sage); outline-offset: 2px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 95; background: #2B3A32; color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

/* auth */
.auth { position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px)); }
.auth .box { max-width: 420px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; }
.logo { font-family: var(--font-display); font-size: 40px; line-height: 1.1; }
.logo .g { color: #4E876D; } .logo .o { color: #D9694F; } .logo .b { color: #2C6FA8; }
.salam { display: inline-block; font-size: 15px; background: var(--surface); border: 1px solid var(--sage-bd); padding: 4px 16px; border-radius: 999px; color: #2F5F49; }
.heroav { width: 148px; height: 148px; margin: 0 auto; background: var(--surface); border: 4px solid #E2EBDD; border-radius: 50%; padding: 10px; }
.heroav svg { width: 100%; height: 100%; }
.authform { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; text-align: left; }
.err { color: var(--a); font-size: 13px; min-height: 20px; margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

.tiles { }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ro { background: var(--sand); border: 1px dashed #D2CBB7; border-radius: 14px; padding: 8px 12px; font-size: 13px; color: var(--ink2); margin-top: 10px; }
.gtable td.l, .gtable th.l { text-align: left; }
.gtable td { white-space: nowrap; }
.gpa { font-family: var(--font-display); font-size: 26px; line-height: 1.1; color: var(--sage-d); }
.rep-head { text-align: center; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
.sign { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 36px; font-size: 13px; color: var(--ink2); }
.iconbtn .sync { display: block; }
button.iconbtn { border: 0; }
.chip input[type=radio] { margin: 0 6px 0 0; }
@media print {
  body { background: #fff; color: #000; }
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; }
  .noprint { display: none !important; }
  .tablewrap { overflow: visible; border-color: #999; }
  th, td { color: #000; }
}

  const memberList = () => Object.keys(members).map((k) => members[k]).sort((a, b) => ((a.name || a.email || '').localeCompare(b.name || b.email || '', 'th')));

            const fire = () => ok({ docs: memberList().filter((m) => m.role === 'admin' || m.role === 'teacher').map((m) => ({ id: m.id, data: () => ({ id: m.id, name: m.name || '' }) })) });

      'auth/popup-closed-by-user': 'ปิดหน้าต่าง Google ก่อนเสร็จ ลองอีกครั้ง', 'auth/popup-blocked': 'เบราว์เซอร์บล็อกหน้าต่าง Google ให้ใช้อีเมลแทน',

const RULES_TEXT = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() { return request.auth != null; }\n    function hasMember() { return signedIn() && exists(/databases/$(database)/documents/members/$(request.auth.uid)); }\n    function role() { return get(/databases/$(database)/documents/members/$(request.auth.uid)).data.role; }\n    function isAdmin() { return hasMember() && role() == 'admin'; }\n    function canWrite() { return hasMember() && role() in ['admin', 'teacher']; }\n    function canRead() { return hasMember() && role() in ['admin', 'teacher', 'viewer']; }\n\n    // ผู้ดูแลคนแรก: สร้างได้ครั้งเดียว\n    match /meta/setup {\n      allow read: if signedIn();\n      allow create: if signedIn() && request.resource.data.adminUid == request.auth.uid\n        && getAfter(/databases/$(database)/documents/members/$(request.auth.uid)).data.role == 'admin';\n      allow update, delete: if false;\n    }\n\n    // สมาชิกและสิทธิ์\n    match /members/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || canRead());\n      allow create: if signedIn() && request.auth.uid == uid && (\n        request.resource.data.role == 'pending'\n        || (request.resource.data.role == 'admin'\n            && !exists(/databases/$(database)/documents/meta/setup)\n            && existsAfter(/databases/$(database)/documents/meta/setup)));\n      allow update: if signedIn() && (\n        (isAdmin() && request.auth.uid != uid)\n        || (request.auth.uid == uid && request.resource.data.role == resource.data.role));\n      allow delete: if isAdmin() && request.auth.uid != uid;\n    }\n\n    // ข้อมูลของแอพ\n    match /{col}/{docId} {\n      allow read: if col in ['cfg','students','assignments','items','asg','sc','att','conduct','files'] && canRead();\n      allow write: if col in ['cfg','students','assignments','items','asg','sc','att','conduct','files'] && canWrite();\n    }\n  }\n}\n";

/* ============ attendance model ============ */
const ATT = { p: { t: 'มา', full: 'มาเรียน' }, l: { t: 'สาย', full: 'มาสาย' }, v: { t: 'ลา', full: 'ลา' }, a: { t: 'ขาด', full: 'ขาดเรียน' } };
function attOf(stuId) {
  const r = { p: 0, l: 0, v: 0, a: 0, days: 0, rate: null };
  for (const d in S.att) {
    const c = S.att[d][stuId];
    if (!c) continue;
    r.days++; r[c]++;
  }
  if (r.days) r.rate = Math.round(((r.p + r.l) / r.days) * 100);
  return r;
}
function dayRecorded(date) {
  const day = S.att[date];
  if (!day) return false;
  return roomStudents().some((s) => day[s.id]);
}
function setAtt(stuId, code) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  const date = V.attDate;
  const had = dayRecorded(date);

V.wcq = ''; V.wcMode = 'timer'; V.wcRange = '7';
function wcOut(sid) { for (const d in S.trips) for (const id in S.trips[d]) { const t = S.trips[d][id]; if (t.sid === sid && !t.e) return { id, d, s: t.s }; } return null; }
function wcTrips(sids, range) {
  const set = new Set(sids), cut = range === 'all' ? '' : toDateStr(new Date(Date.now() - (range === '1' ? 0 : +range) * 864e5)), out = [];
  for (const d in S.trips) { if (cut && d < cut) continue; for (const id in S.trips[d]) { const t = S.trips[d][id]; if (set.has(t.sid)) out.push({ id, d, sid: t.sid, s: t.s, e: t.e }); } }
  return out;
}
function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60);
  return m ? m + ' นาที' + (s % 60 ? ' ' + (s % 60) + ' วิ' : '') : s + ' วิ';
}
const fmtClock = (ms) => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const clockMS = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function wcStart(sid) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  if (wcOut(sid)) return;
  const d = today(); (S.trips[d] = S.trips[d] || {})[uid('w')] = { sid, s: Date.now(), e: 0 };
  commit(); render(); toast('เดินทางปลอดภัยนะ 🚻 เริ่มจับเวลาแล้ว');
}
function wcBack(sid) {
  const o = wcOut(sid); if (!o || !CAN_WRITE) return;
  const t = S.trips[o.d][o.id]; t.e = Date.now(); const ms = t.e - t.s;
  commit(); render();
  toast((ms < 60000 ? 'เร็วจัง ⚡ ' : ms <= 300000 ? 'กลับมาแล้ว เก่งมาก 🌟 ' : ms <= 600000 ? 'ยินดีต้อนรับกลับ 🐣 ' : 'คิดถึงนะ 🐢 ') + fmtDur(ms));
}
function wcCancel(sid) { const o = wcOut(sid); if (!o || !CAN_WRITE) return; delete S.trips[o.d][o.id]; if (!Object.keys(S.trips[o.d]).length) delete S.trips[o.d]; commit(); render(); toast('ยกเลิกการจับเวลาแล้ว'); }
function wcDelTrip(d, id, sid) { if (!CAN_WRITE || !S.trips[d]) return; delete S.trips[d][id]; if (!Object.keys(S.trips[d]).length) delete S.trips[d]; commit(); openWcStu(sid); render(); }
setInterval(() => { document.querySelectorAll('[data-wc]').forEach((el) => { el.textContent = clockMS(Date.now() - +el.dataset.wc); }); }, 1000);
function wcStatsFor(sid, range) {
  const l = wcTrips([sid], range).filter((t) => t.e), tot = l.reduce((p, t) => p + (t.e - t.s), 0);
  return { n: l.length, tot, avg: l.length ? tot / l.length : 0, max: l.reduce((p, t) => Math.max(p, t.e - t.s), 0), list: l };
}
function wcFace(n, max) { return n === 0 ? '🌵' : n === max && n >= 3 ? '💧' : n >= 4 ? '🌊' : '🫧'; }
function renderWcList() { const l = $('#wc-list'); if (l) l.innerHTML = wcListHTML(roomStudents()); }

}

function parseStudentLine(raw) {
  let cols = raw.split('\t').map((c) => c.trim()).filter(Boolean);
  if (!cols.length) return null;
  if (cols.length >= 3 && /^\d{1,3}$/.test(cols[0])) cols.shift();
  if (cols.length >= 2 && /\d/.test(cols[0]) && !/[ก-๙]/.test(cols[0])) return { code: cols[0], name: cols.slice(1).join(' ') };
  let l = cols.join(' ').replace(/^\d{1,3}\s*[.)]\s+/, '');
  const m = /^(?=\S*\d)([A-Za-z0-9][A-Za-z0-9\-\/]*)\s+(.+)$/.exec(l);
  return m ? { code: m[1], name: m[2].trim() } : { code: '', name: l };
}

/* ---- ไฟล์แนบ (ที่เก็บไฟล์ของแอพ) ---- */
const FILE_TYPES = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', txt: 'text/plain', csv: 'text/csv', md: 'text/markdown', json: 'application/json', mp4: 'video/mp4', webm: 'video/webm' };
const MAX_FILE = 650 * 1024;
const fileKind = (f) => FILE_TYPES[(f.name.split('.').pop() || '').toLowerCase()] || null;
function baseName(n) { return n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim(); }
function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function fileProblem(f) {
  if (!fileKind(f)) return 'แนบได้เฉพาะ PDF รูปภาพ และไฟล์ข้อความ (ไฟล์ Word หรือ PowerPoint ให้บันทึกเป็น PDF ก่อน)';
  if (f.size > MAX_FILE) return 'ไฟล์ใหญ่เกิน 650 KB ให้ย่อไฟล์ หรือใช้ช่อง "ลิงก์" วางลิงก์ Google Drive แทน';
  if (!f.size) return 'ไฟล์ว่างเปล่า';
  return '';
}
async function uploadFile(f) {
  let as = null;
  try { as = await window.claude.use('assets'); } catch (e) { /* ignore */ }
  if (!as) throw { code: 'none', message: 'บัญชีนี้แนบไฟล์ไม่ได้ ต้องเป็นผู้ดูแลหรือครูผู้สอน' };
  const r = await as.upload(f, { type: fileKind(f) });
  return { id: r.id, name: f.name, size: f.size, type: r.contentType };
}
function uploadMsg(e) {
  const c = e && e.code;
  if (c === 'none') return e.message;
  if (c === 'too_large') return 'ไฟล์ใหญ่เกินกำหนด';
  if (c === 'unsupported_type') return 'ไฟล์ชนิดนี้แนบไม่ได้';
  if (c === 'quota_or_state') return 'พื้นที่เก็บไฟล์เต็ม ลบใบงานเก่าที่ไม่ใช้แล้วลองใหม่';
  if (c === 'rate_limited') return 'อัปโหลดถี่เกินไป รอสักครู่แล้วลองใหม่';
  return 'อัปโหลดไม่สำเร็จ ลองอีกครั้งนะคะ';
}
function fileLinkHTML(a) {

let _pdfLib = null; const _pdfDocs = {};
function loadScriptTag(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
async function getPdfLib() {
  if (_pdfLib) return _pdfLib;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScriptTag(base + 'pdf.min.js'); await loadScriptTag(base + 'pdf.worker.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';

}
async function wsPdf(url, b, w, tok) {
  const lib = await getPdfLib();
  let doc = _pdfDocs[url];
  if (!doc) { const r = await fetch(url); if (!r.ok) throw new Error('fetch'); doc = _pdfDocs[url] = await lib.getDocument({ data: new Uint8Array(await r.arrayBuffer()) }).promise; }
  if (tok !== WS.tok) return;
  b.innerHTML = '';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  for (let i = 1; i <= doc.numPages; i++) {
    const pg = await doc.getPage(i); if (tok !== WS.tok) return;
    const sc = w / pg.getViewport({ scale: 1 }).width, vp = pg.getViewport({ scale: sc * dpr });
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);

  }
}

/* ============ grades: คำนวณเกรดอัตโนมัติ ============ */
function collectItems(rid, sid, term) {
  const out = [];
  S.assignments.forEach((a) => { if (a.roomId === rid && a.subjectId === sid && a.term === term) out.push({ k: 'a', id: a.id, max: a.max, title: a.title }); });
  S.scoreItems.forEach((x) => { if (x.roomId === rid && x.subjectId === sid && x.term === term && x.kind !== 'exam') out.push({ k: 's', id: x.id, max: x.max, title: x.title }); });
  return out;
}
const examItem = (rid, sid, term) => S.scoreItems.find((x) => x.roomId === rid && x.subjectId === sid && x.term === term && x.kind === 'exam');
function markVal(item, stuId) {
  return item.k === 'a' ? (S.asg[item.id] && S.asg[item.id][stuId] && S.asg[item.id][stuId].p) : (S.sc[item.id] && S.sc[item.id][stuId]);
}
/* ตัดเกรดตามช่วงคะแนนในหน้าตั้งค่า */
function gradeOfPct(p) {
  const sc = S.settings.scale.slice().sort((a, b) => b[0] - a[0]);
  for (const r of sc) if (p >= r[0]) return r[1];
  return 0;
}
/* งานที่ยังค้าง (ไม่ติ๊กส่ง) ของนักเรียนในวิชา/เทอม — ใช้เตือนข้างเกรด ไม่เปลี่ยนเกรด */
function owedN(rid, sid, subId, term) {
  return S.assignments.filter((a) => a.roomId === rid && a.subjectId === subId && (term == null || a.term === term) && !(S.asg[a.id] && S.asg[a.id][sid] && S.asg[a.id][sid].d)).length;
}
const owedTag = (n, g) => (n && g != null ? `<sup style="color:#c0392b;font-weight:700;white-space:nowrap"> *ค้าง ${n}</sup>` : '');
const fmtG = (g) => (g == null ? '–' : String(Math.round(g * 10) / 10));
/* รายการคะแนนเก็บที่ "มีผลแล้ว" (มีนักเรียนอย่างน้อย 1 คนมีคะแนน) ช่องว่างของรายการนั้นนับเป็น 0 */
function termCtx(rid, sid, term) {
  const sub = S.subjects.find((x) => x.id === sid) || NO_SUBJ;
  const stu = S.students.filter((s) => s.roomId === rid);
  const items = collectItems(rid, sid, term).filter((it) => stu.some((s) => num(markVal(it, s.id))));
  const ex = examItem(rid, sid, term);
  const exGraded = ex && stu.some((s) => num(S.sc[ex.id] && S.sc[ex.id][s.id]));
  return { sub, term, items, collMax: items.reduce((p, c) => p + c.max, 0), ex: exGraded ? ex : null };
}
function ctxOf(rid, sid, term) { const k = rid + '|' + sid + '|' + term; return CTX[k] || (CTX[k] = termCtx(rid, sid, term)); }
function calcStudent(ctx, stuId) {
  const w1 = ctx.sub.collectW, w2 = ctx.sub.examW;
  const cwE = Math.min(cdW(), w1), wWork = w1 - cwE; // คะแนนเก็บ = งาน (w1 − จิตพิสัย) + จิตพิสัย (เกณฑ์เดียวกันทุกวิชา)
  let got = 0;
  ctx.items.forEach((it) => { const v = markVal(it, stuId); if (num(v)) got += v; });
  const collPct = ctx.collMax ? got / ctx.collMax : null;
  let examPct = null;
  if (ctx.ex) { const v = S.sc[ctx.ex.id] && S.sc[ctx.ex.id][stuId]; examPct = ctx.ex.max ? (num(v) ? v : 0) / ctx.ex.max : null; }
  const workScore = collPct == null ? null : round2(collPct * wWork);
  const conductScore = cwE > 0 && cdW() > 0 ? round2(cdTotal(stuId, ctx.term).total / cdW() * cwE) : 0;
  const collScore = workScore == null ? null : round2(workScore + conductScore);
  const examScore = examPct == null ? null : round2(examPct * w2);
  let total = null, status = '';
  if (collScore == null) status = 'ยังไม่มีคะแนนเก็บ'; else if (examScore == null) status = 'รอผลสอบ'; else total = round2(collScore + examScore);
  const pct = total == null || !(w1 + w2) ? null : round2((total / (w1 + w2)) * 100);
  return { collScore, workScore, conductScore, examScore, total, pct, grade: pct == null ? null : gradeOfPct(pct), status };
}
const termResult = (rid, sub, stuId, term) => calcStudent(ctxOf(rid, sub.id, term), stuId);
function yearResult(rid, sub, stuId) {
  const a = termResult(rid, sub, stuId, 1), b = termResult(rid, sub, stuId, 2);
  if (a.pct == null || b.pct == null) return { a, b, pct: null, grade: null };
  const pct = round2((a.pct + b.pct) / 2);
  return { a, b, pct, grade: gradeOfPct(pct) };
}
function gpaOf(list) {
  let sw = 0, s = 0;
  list.forEach((x) => { if (x.grade != null) { s += x.grade * x.credit; sw += x.credit; } });
  return sw ? Math.round((s / sw) * 100) / 100 : null;
}
const fmtGpa = (g) => (g == null ? '–' : g.toFixed(2));

function pickLogo(inp) {
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f || !isAdmin()) return;
  if (!/^image\//.test(f.type)) { toast('เลือกไฟล์รูปภาพเท่านั้น'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      let max = 240, url = '', cleaned = false;
      for (let i = 0; i < 4; i++) {
        const k = Math.min(1, max / Math.max(img.width || 1, img.height || 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round((img.width || 1) * k)); c.height = Math.max(1, Math.round((img.height || 1) * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const lc = logoClean(c); cleaned = lc.changed; url = lc.canvas.toDataURL('image/png');
        if (url.length < 120000) break;
        max = Math.round(max * 0.7);
      }
      if (url.length >= 120000) { toast('รูปโลโก้ซับซ้อนเกินไป ลองใช้รูปที่เรียบกว่านี้'); return; }
      S.settings.logo = url; commit(); render(); toast(cleaned ? 'ตั้งโลโก้แล้ว (ลบพื้นหลังให้แล้ว)' : 'ตั้งโลโก้แล้ว');
    };
    img.onerror = () => toast('อ่านรูปไม่สำเร็จ');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
/* ---- ลบพื้นหลังโลโก้ (ลบเฉพาะพื้นที่สีพื้นที่ติดขอบรูป ไม่ลบสีขาวที่อยู่ในตัวโลโก้) ---- */
function logoClean(c) {
  const w = c.width, h = c.height, x = c.getContext('2d', { willReadFrequently: true }), d = x.getImageData(0, 0, w, h), px = d.data;
  for (let p = 3; p < px.length; p += 4) { if (px[p] < 250) return { canvas: c, changed: false }; }
  const at = (i) => [px[i * 4], px[i * 4 + 1], px[i * 4 + 2]];
  const cs = [at(0), at(w - 1), at((h - 1) * w), at(h * w - 1)];
  const bg = [0, 1, 2].map((k) => Math.round(cs.reduce((s, v) => s + v[k], 0) / 4));
  const dist = (i) => Math.max(Math.abs(px[i * 4] - bg[0]), Math.abs(px[i * 4 + 1] - bg[1]), Math.abs(px[i * 4 + 2] - bg[2]));
  const TOL = 42, seen = new Uint8Array(w * h), st = [];
  const push = (i) => { if (!seen[i] && dist(i) <= TOL) { seen[i] = 1; st.push(i); } };
  for (let xx = 0; xx < w; xx++) { push(xx); push((h - 1) * w + xx); }
  for (let yy = 0; yy < h; yy++) { push(yy * w); push(yy * w + w - 1); }
  while (st.length) {
    const i = st.pop(), xx = i % w, yy = (i - xx) / w;
    if (xx > 0) push(i - 1); if (xx < w - 1) push(i + 1); if (yy > 0) push(i - w); if (yy < h - 1) push(i + w);
  }
  let n = 0;
  for (let i = 0; i < w * h; i++) if (seen[i]) { px[i * 4 + 3] = 0; n++; }
  if (n < w * h * 0.02) return { canvas: c, changed: false };
  for (let i = 0; i < w * h; i++) { // ลบขอบแข็งให้นุ่มขึ้น
    if (seen[i]) continue;
    const xx = i % w, yy = (i - xx) / w;
    if ((xx > 0 && seen[i - 1]) || (xx < w - 1 && seen[i + 1]) || (yy > 0 && seen[i - w]) || (yy < h - 1 && seen[i + w])) {
      const dd = dist(i); if (dd < TOL * 2.2) px[i * 4 + 3] = Math.round(255 * Math.max(0.25, (dd - TOL) / (TOL * 1.2)));
    }
  }
  x.putImageData(d, 0, 0);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) if (px[(yy * w + xx) * 4 + 3] > 12) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
  if (x1 < 0) return { canvas: c, changed: false };
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return { canvas: o, changed: true };
}

function loadImgFile(f) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u;

async function pickSign(i, inp) {
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f || !isAdmin()) return;
  if (!/^image\/(png|jpe?g|webp|gif)$/.test(f.type)) { toast('เลือกไฟล์รูป PNG หรือ JPG'); return; }
  collectSign();
  toast('กำลังประมวลผลรูปลายเซ็น…');
  try {
    const im = await loadImgFile(f), k = Math.min(1, 700 / Math.max(im.width, im.height, 1));
    let c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    let x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
    let opaque = true;
    for (let p = 3; p < px.length; p += 4) { if (px[p] < 250) { opaque = false; break; } }
    if (opaque) {
      for (let p = 0; p < px.length; p += 4) {

    const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;

    const old = S.settings.sign[i].img;
    S.settings.sign[i].img = r.id; commit(); render();
    toast(opaque ? 'ตั้งลายเซ็นแล้ว (ทำพื้นขาวให้โปร่งใสให้แล้ว)' : 'ตั้งลายเซ็นแล้ว');
    dropSignAsset(old);
  } catch (e) { toast(e && e.code ? uploadMsg(e) : 'อ่านรูปไม่สำเร็จ ลองรูปอื่น'); }
}

/* ============ export / backup ============ */
async function saveFile(name, data) {
  let dl = null;
  try { dl = await window.claude.use('downloads'); } catch (e) { /* ignore */ }
  if (!dl) { toast('ดาวน์โหลดไฟล์ไม่ได้ ลองใหม่อีกครั้ง'); return false; }
  try { await dl.save({ filename: name, data }); return true; }
  catch (e) { if (!(e && e.code === 'declined')) toast('บันทึกไฟล์ไม่สำเร็จ'); return false; }
}
function sheetName(name, used) {
  let n = name.replace(/[\\\/?*\[\]:]/g, '_').slice(0, 31) || 'Sheet';
  const base = n; let i = 2;
  while (used.has(n.toLowerCase())) { n = base.slice(0, 28) + '_' + i++; }
  used.add(n.toLowerCase());
  return n;
}
function gradeSheet(gt) {
  const rid = room().id;
  return roomStudents().map((s, i) => {
    const r = { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name }, list = [];
    roomSubs(rid).forEach((sub) => {
      if (gt === 'y') {
        const y = yearResult(rid, sub, s.id); list.push({ grade: y.grade, credit: sub.credit });
        r[sub.name + ' เทอม1'] = y.a.total == null ? '' : y.a.total; r[sub.name + ' เทอม2'] = y.b.total == null ? '' : y.b.total;
        r[sub.name + ' เฉลี่ย%'] = y.pct == null ? '' : y.pct; r[sub.name + ' เกรด'] = y.grade == null ? '' : y.grade;
      } else {
        const t = termResult(rid, sub, s.id, gt); list.push({ grade: t.grade, credit: sub.credit });
        r[sub.name + ' เก็บ'] = t.collScore == null ? '' : t.collScore; r[sub.name + ' สอบ'] = t.examScore == null ? '' : t.examScore;
        r[sub.name + ' รวม'] = t.total == null ? '' : t.total; r[sub.name + ' เกรด'] = t.grade == null ? '' : t.grade;
      }
    });
    const gp = gpaOf(list); r['GPA'] = gp == null ? '' : gp;
    return r;
  });
}
async function exportXlsx() {
  const st = roomStudents();
  if (!st.length) { toast('ยังไม่มีนักเรียนในห้องนี้ เพิ่มรายชื่อก่อนส่งออกนะคะ'); return; }
  if (typeof XLSX === 'undefined') { toast('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้ง'); return; }
  try {
    const rname = room().name, rid = room().id, used = new Set(), wb = XLSX.utils.book_new();
    const add = (rows, name) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName(name, used));
    add(gradeSheet(1), 'ใบเกรดเทอม1'); add(gradeSheet(2), 'ใบเกรดเทอม2'); add(gradeSheet('y'), 'ใบเกรดทั้งปี');
    add(conductSheet(1), 'จิตพิสัยเทอม1'); add(conductSheet(2), 'จิตพิสัยเทอม2');

  document.querySelectorAll('.cs.full').forEach((n) => { n.style.height = vv.height + 'px'; n.style.top = vv.offsetTop + 'px'; n.style.bottom = 'auto'; });

  if (poss >= 20) { const pc = Math.round(got / poss * 100); if (pc < 50) { pt += 3; why.push('คะแนนเฉลี่ย ' + pc + '% (ต่ำ)'); } else if (pc < 60) { pt += 2; why.push('คะแนนเฉลี่ย ' + pc + '%'); } }

  return { on: false, t: m < 1 ? 'ใช้งานเมื่อสักครู่' : m < 60 ? 'ใช้งานเมื่อ ' + m + ' นาทีที่แล้ว' : 'ใช้งานเมื่อ ' + Math.floor(m / 60) + ' ชั่วโมงที่แล้ว' };
}

/* ลายพื้นหลังพาสเทล (ใช้ร่วมกันทั้งแอพและห้องแชท) : ใช้สีที่ส่งเข้ามา ทำเป็นลายจางๆ ให้ดูเรียบ น่ารัก
   k = ชนิดลาย · c = สีหลัก · z = สัดส่วนขนาด (ใช้ย่อลายในช่องตัวอย่าง) → { img, sz } หรือ null */
const PAT_NAMES = { dots: 'ลายจุด', flower: 'ดอกไม้', daisy: 'เดซี่', cloud: 'ก้อนเมฆ', heart: 'หัวใจ', star: 'ดาว' };
function patUri(w, h, inner, z) {
  z = z || 1;
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + Math.round(w * z) + "' height='" + Math.round(h * z) + "' viewBox='0 0 " + w + ' ' + h + "'>" + inner + '</svg>';
  return 'url(data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g, '%27').replace(/\(/g, '%28').replace(/\)/g, '%29') + ')';
}
function pastelPattern(k, c, z) {
  z = z || 1;
  const U = (w, h, inner) => ({ img: patUri(w, h, inner, z), sz: Math.round(w * z) + 'px ' + Math.round(h * z) + 'px' });
  const g = (o, inner) => "<g opacity='" + o + "' fill='" + c + "'>" + inner + '</g>';
  if (k === 'dots') return U(36, 36, g(.32, "<circle cx='9' cy='9' r='2.2'/><circle cx='27' cy='27' r='2.2'/>"));
  if (k === 'flower') {
    const fl = (cx, cy, r) => { let o = ''; for (let i = 0; i < 5; i++) { const a = (i * 72 - 90) * Math.PI / 180; o += "<circle cx='" + (cx + r * 1.5 * Math.cos(a)).toFixed(1) + "' cy='" + (cy + r * 1.5 * Math.sin(a)).toFixed(1) + "' r='" + r + "'/>"; } return o; };
    const ctr = (cx, cy, r) => "<circle cx='" + cx + "' cy='" + cy + "' r='" + r + "' fill='#F6D77A'/>";
    return U(80, 80, g(.34, fl(20, 20, 4.4) + fl(60, 58, 4.4) + "<circle cx='60' cy='14' r='1.8'/><circle cx='18' cy='62' r='1.8'/>") + ctr(20, 20, 2.6) + ctr(60, 58, 2.6));
  }
  if (k === 'daisy') {
    const dz = (cx, cy) => { let o = ''; for (let i = 0; i < 8; i++) o += "<ellipse cx='" + cx + "' cy='" + (cy - 8) + "' rx='2.6' ry='5.4' transform='rotate(" + (i * 45) + ' ' + cx + ' ' + cy + ")'/>"; return o; };
    const ctr = (cx, cy) => "<circle cx='" + cx + "' cy='" + cy + "' r='3' fill='#F6D77A'/>";
    return U(84, 84, g(.3, dz(22, 24) + dz(64, 64) + "<circle cx='66' cy='16' r='1.6'/><circle cx='18' cy='68' r='1.6'/>") + ctr(22, 24) + ctr(64, 64));
  }
  if (k === 'cloud') {
    const cl = (x, y, sc) => "<g transform='translate(" + x + ' ' + y + ') scale(' + sc + ")'><circle cx='11' cy='15' r='7'/><circle cx='22' cy='10' r='9.5'/><circle cx='33' cy='15' r='7'/><rect x='11' y='15' width='22' height='7'/></g>";
    return U(110, 100, g(.27, cl(6, 8, 1) + cl(62, 54, .8) + "<circle cx='84' cy='16' r='1.7'/><circle cx='24' cy='70' r='1.7'/><circle cx='50' cy='44' r='1.2'/>"));
  }
  if (k === 'heart') {
    const ht = (x, y, sc) => "<path transform='translate(" + x + ' ' + y + ') scale(' + sc + ")' d='M10 17.5C-4 8 2 -1 10 5.2C18 -1 24 8 10 17.5Z'/>";
    return U(76, 76, g(.3, ht(8, 10, 1) + ht(44, 44, .8) + "<circle cx='54' cy='12' r='1.6'/><circle cx='14' cy='56' r='1.6'/>"));
  }
  if (k === 'star') {
    const st = (cx, cy, r) => { let o = ''; for (let i = 0; i < 10; i++) { const a = (i * 36 - 90) * Math.PI / 180, rr = i % 2 ? r * .46 : r; o += (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1) + ' '; } return "<polygon points='" + o + "' stroke='" + c + "' stroke-width='1.6' stroke-linejoin='round'/>"; };
    return U(76, 76, g(.32, st(18, 18, 7) + st(56, 54, 5.5) + "<circle cx='56' cy='14' r='1.5'/><circle cx='16' cy='58' r='1.5'/>"));
  }
  return null;
}

/* ลายพื้นหลังของ "แอพ" (ไม่เกี่ยวกับห้องแชท) */
const BG_KEY = 'abdia_bg';
const BGS = { none: { n: 'เรียบ', e: '⬜' }, paper: { n: 'กระดาษมีเส้น', e: '📄' }, dots: { n: 'ลายจุด', e: '⚪' }, flower: { n: 'ดอกไม้', e: '🌸' }, daisy: { n: 'เดซี่', e: '🌼' }, cloud: { n: 'ก้อนเมฆ', e: '☁️' }, heart: { n: 'หัวใจ', e: '💗' }, star: { n: 'ดาว', e: '⭐' } };
function bgKey() { try { const k = localStorage.getItem(BG_KEY); return BGS[k] ? k : 'none'; } catch (e) { return 'none'; } }
function bgPattern(k, c) {
  if (k === 'paper') { const u = patUri(120, 30, "<line x1='0' y1='29.4' x2='120' y2='29.4' stroke='" + c + "' stroke-opacity='.3' stroke-width='1.2'/>"); return { img: 'linear-gradient(90deg, transparent 34px, rgba(240,140,166,.4) 34px, rgba(240,140,166,.4) 36px, transparent 36px), ' + u, sz: '100% 100%, 120px 30px' }; }
  return pastelPattern(k, c);
}
function applyBg() {
  const st = document.documentElement.style, p = bgPattern(bgKey(), (THEMES[themeKey()] || {}).sage || '#4E876D');
  if (p) { st.setProperty('--bgimg', p.img); st.setProperty('--bgsz', p.sz); } else { st.removeProperty('--bgimg'); st.removeProperty('--bgsz'); }
}
function setBg(k) {
  if (!BGS[k]) return;
  try { localStorage.setItem(BG_KEY, k); } catch (e) { /* ignore */ }
  applyBg();
  document.querySelectorAll('.bgc').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.bg === k)));
}
function themeKey() { try { const k = localStorage.getItem(TH_KEY); return THEMES[k] ? k : 'sage'; } catch (e) { return 'sage'; } }
function applyTheme(k) {
  const t = THEMES[k] || THEMES.sage, st = document.documentElement.style;
  const map = { '--bg': t.bg, '--sand': t.sand, '--line': t.line, '--sage': t.sage, '--sage-d': t.d, '--sage-l': t.l, '--sage-bd': t.bd, '--on-sage': t.on, '--ph1': t.ph && t.ph[0], '--ph2': t.ph && t.ph[1] };
  Object.keys(map).forEach((v) => { if (map[v]) st.setProperty(v, map[v]); else st.removeProperty(v); });
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t.bg || '#FAF8F3');
  applyBg();
}
function setTheme(k) {
  if (!THEMES[k]) return;
  try { localStorage.setItem(TH_KEY, k); } catch (e) { /* ignore */ }
  applyTheme(k);
  document.querySelectorAll('.thc').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.th === k)));
}
function themeChipsHTML() {
  const cur = themeKey();
  return '<div class="thwrap">' + Object.keys(THEMES).map((k) => { const t = THEMES[k];
    return `<button class="chip thc" data-th="${k}" aria-pressed="${cur === k}" onclick="setTheme('${k}')"><span class="thdot" style="background:${t.sage || '#4E876D'}"></span>${t.n}</button>`; }).join('') + '</div><div class="xs muted" style="margin:12px 0 6px">พื้นหลัง</div><div class="thwrap">' + Object.keys(BGS).map((k) => `<button class="chip bgc" data-bg="${k}" aria-pressed="${bgKey() === k}" onclick="setBg('${k}')">${BGS[k].e} ${BGS[k].n}</button>`).join('') + '</div>';
}
function themeCardHTML() {
  return `<div class="card"><h3 class="h3" style="margin-bottom:4px">🎨 สีธีมและพื้นหลังของแอพ</h3><p class="xs muted" style="margin-bottom:8px">เลือกโทนพาสเทลและลายพื้นหลังของ "แอพ" ใช้เฉพาะเครื่องนี้ · ห้องแชทมีธีมแยกต่างหาก ปรับได้ที่ปุ่ม 🎀 ในห้องแชทเลยน้า</p>${themeChipsHTML()}</div>`;
}
function openThemeModal() { modal(`<h3 class="h3" style="margin-bottom:4px">🎨 สีธีมของแอพ</h3><p class="xs muted" style="margin-bottom:10px">เลือกโทนพาสเทลที่ชอบได้เลยน้า</p>${themeChipsHTML()}<div class="btnrow" style="margin-top:14px"><button class="btn primary" onclick="closeModal()">เรียบร้อย</button></div>`); }
applyTheme(themeKey());

/* ============ ฟองแชทลอย (ลากได้ ปล่อยแล้วดูดเข้าขอบ ลากไปที่ ✕ เพื่อซ่อน) ============ */
const CB = { el: null, zone: null, x: 0, y: 0, side: 'r', yr: 0.62, hid: false, n: -1, key: 'abdia_cbub', go: null, sig: '' };
const CB_S = 58, CB_M = 6;
function cbLoad() { try { const o = JSON.parse(localStorage.getItem(CB.key) || '{}'); if (o.s === 'l' || o.s === 'r') CB.side = o.s; if (typeof o.y === 'number' && o.y >= 0 && o.y <= 1) CB.yr = o.y; } catch (e) { /* ignore */ } }
function cbSave() { try { localStorage.setItem(CB.key, JSON.stringify({ s: CB.side, y: CB.yr })); } catch (e) { /* ignore */ } }
const cbMinY = () => 64, cbMaxY = () => Math.max(cbMinY(), window.innerHeight - CB_S - 76);
function cbPlace(x, y) { CB.x = x; CB.y = y; if (CB.el) CB.el.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)'; }
function cbDock(anim) {
  if (!CB.el) return;
  const w = window.innerWidth, y = Math.min(cbMaxY(), Math.max(cbMinY(), CB.yr * window.innerHeight));
  CB.el.classList.toggle('snap', !!anim);
  cbPlace(CB.side === 'l' ? CB_M : w - CB_S - CB_M, y);
}
function cbMake() {
  if (CB.el) return;
  cbLoad();
  const b = document.createElement('button'); b.id = 'cbub'; b.type = 'button'; b.setAttribute('aria-label', 'เปิดข้อความ (ลากเพื่อย้าย)'); b.title = 'ข้อความ';
  const z = document.createElement('div'); z.id = 'cbx'; z.setAttribute('aria-hidden', 'true'); z.textContent = '✕';
  document.body.appendChild(z); document.body.appendChild(b); CB.el = b; CB.zone = z;
  let st = null;
  const overZone = () => { const r = z.getBoundingClientRect(), cx = CB.x + CB_S / 2, cy = CB.y + CB_S / 2; return Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2)) < 64; };
  b.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    st = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: CB.x, oy: CB.y, moved: false };
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  b.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
    if (!st.moved && Math.hypot(dx, dy) < 7) return;
    if (!st.moved) { st.moved = true; b.classList.remove('snap'); b.classList.add('drag'); z.classList.add('on'); }
    const w = window.innerWidth, h = window.innerHeight;
    cbPlace(Math.min(w - CB_S - 2, Math.max(2, st.ox + dx)), Math.min(h - CB_S - 2, Math.max(2, st.oy + dy)));
    z.classList.toggle('hot', overZone());
  });
  const end = (e, cancel) => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null; b.classList.remove('drag'); z.classList.remove('on');
    try { b.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (!s.moved) { if (!cancel && CB.go) CB.go(); return; }
    const hot = z.classList.contains('hot'); z.classList.remove('hot');
    if (hot && !cancel) { CB.hid = true; b.hidden = true; toast('ซ่อนฟองแชทแล้ว จะกลับมาเมื่อมีข้อความใหม่น้า 🫧'); return; }
    CB.side = CB.x + CB_S / 2 < window.innerWidth / 2 ? 'l' : 'r';
    CB.yr = Math.min(cbMaxY(), Math.max(cbMinY(), CB.y)) / window.innerHeight; cbSave(); cbDock(true);
  };
  b.addEventListener('pointerup', (e) => end(e, false));
  b.addEventListener('pointercancel', (e) => end(e, true));
  b.addEventListener('click', (e) => { if (e.detail === 0 && CB.go) CB.go(); }); /* กดด้วยคีย์บอร์ด */
  window.addEventListener('resize', () => cbDock(false));
  cbDock(false);
}
function cbState() {
  if (PT) {
    if (!P.d || P.chat || P.tab === 'msg') return null;
    return { n: pTotalUnread(), go: () => pTab('msg') };
  }
  if (!(C.ready && CAN_WRITE)) return null;
  if (document.getElementById('pmbox') || !document.getElementById('modal').hidden || document.getElementById('msgpop')) return null;
  const a = Math.max(PM.unread, 0), d = Math.max(PM.dmUnread, 0);
  return { n: a + d, go: () => openPmsg(a <= 0 && d > 0 ? 'dm' : undefined) };
}
function cbSync() {
  const s = cbState();
  if (!s) { if (CB.el) CB.el.hidden = true; return; }
  cbMake();
  if (s.n > CB.n && CB.n >= 0) { CB.hid = false; CB.el.classList.remove('ring'); void CB.el.offsetWidth; CB.el.classList.add('ring'); }
  CB.n = s.n; CB.go = s.go; CB.el.hidden = CB.hid;
  /* ฟองลอย = รูปโปรไฟล์ที่เจ้าของเครื่องเลือกไว้ (ผู้ปกครอง: รูปในห้องแชท · ครู: รูปของฉัน) + สีขอบตามธีมแชท */
  const av = PT ? myPav() : tAv(MEID), acc = (CHAT_THEMES[chatPref().th] || CHAT_THEMES.sky).acc;
  const sig = s.n + '|' + av + '|' + acc; if (sig !== CB.sig) {
    CB.sig = sig; CB.el.style.setProperty('--cbc', acc);
    CB.el.innerHTML = '<span class="cbav">' + avatarSVG(av) + '</span><i class="cbtag">' + ic('chat', 11) + '</i>' + (s.n > 0 ? '<i class="pbad">' + (s.n > 99 ? '99+' : s.n) + '</i>' : '');
  }
}
setInterval(cbSync, 800);
// ฟังก์ชันขอสิทธิ์แจ้งเตือน
async function requestNotificationPermission() {
    if (!("Notification" in window)) {
        alert("เบราว์เซอร์ของคุณไม่รองรับการแจ้งเตือนครับ");
        return;
    }
    try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
            console.log('อนุญาตแจ้งเตือนแล้ว');
            alert('เปิดใช้งานการแจ้งเตือนเรียบร้อยแล้วครับ!');
        } else if (permission === 'denied') {
            alert('คุณปฏิเสธการรับการแจ้งเตือน สามารถเปิดใหม่ได้ที่การตั้งค่าเบราว์เซอร์');
        }
    } catch (error) {
        console.error('เกิดข้อผิดพลาด:', error);
    }
}

init();
